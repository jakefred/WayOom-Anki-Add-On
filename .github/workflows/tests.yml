name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/build_credentials.py
      - run: python scripts/package_addon.py
      - run: npm test
      - run: python -m unittest discover -s tests/python -v
      - run: python -m unittest discover -s tests/integration -v
      - uses: actions/upload-artifact@v6
        with:
          name: wayoom-${{ matrix.os }}
          path: |
            dist/*.ankiaddon
            dist/*.sha256
