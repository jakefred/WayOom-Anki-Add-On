name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: python -m pip install -r requirements-test.txt
      - run: python scripts/build_credentials.py
      - run: npm test
      - run: python -m unittest discover -s tests/python -v
      - run: python -m unittest discover -s tests/integration -v
